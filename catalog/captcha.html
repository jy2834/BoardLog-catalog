<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'unsafe-inline'; frame-src https://challenges.cloudflare.com; connect-src https://challenges.cloudflare.com; img-src 'self' data:"
    >
    <meta name="boardlog-turnstile-site-key" content="0x4AAAAAAEOC7P5W3pi7ec21">
    <title>보드로그 사람 확인</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: transparent; }
      main { width: min(100% - 32px, 360px); text-align: center; }
      p { color: #6f625d; font-size: 14px; }
      #turnstile { min-height: 70px; display: grid; place-items: center; }
    </style>
    <script src="./captcha.js" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
  </head>
  <body>
    <main>
      <h1>사람인지 확인할게요</h1>
      <p>검수 요청을 보내기 전에 한 번만 확인합니다.</p>
      <div
        id="turnstile"
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAEOC7P5W3pi7ec21"
        data-action="boardlog_submit"
        data-callback="boardLogTurnstileSuccess"
        data-expired-callback="boardLogTurnstileExpired"
        data-error-callback="boardLogTurnstileError"
        aria-live="polite"
      ></div>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
