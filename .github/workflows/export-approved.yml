name: Export approved catalog games

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      submission_id:
        description: Optional approved submission UUID to export
        required: false
        type: string
      all_pending_exports:
        description: Export the next bounded batch of approved submissions
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pillow==12.3.0
      - run: python3 -m unittest discover -s tests -v
      - run: >-
          python3 scripts/validate_catalog.py
          --catalog catalog/catalog.json
          --schema catalog/schema.json
          --images-dir catalog/images
      - name: Publish reviewed rows
        id: publish
        env:
          INPUT_SUBMISSION_ID: ${{ inputs.submission_id }}
          INPUT_ALL_PENDING: ${{ inputs.all_pending_exports }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          git config user.name boardlog-catalog-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -n "$INPUT_SUBMISSION_ID" ]; then
            python3 scripts/export_approved.py --defer-acknowledgement --submission-id "$INPUT_SUBMISSION_ID"
          elif [ "$INPUT_ALL_PENDING" = "true" ] || [ -z "$INPUT_ALL_PENDING" ]; then
            python3 scripts/export_approved.py --defer-acknowledgement
          else
            echo "exported_count=0" >> "$GITHUB_OUTPUT"
            echo "catalog_changed=false" >> "$GITHUB_OUTPUT"
            echo "No export target selected."
          fi
      - name: Prepare Pages artifact
        if: steps.publish.outputs.catalog_changed == 'true' || steps.publish.outputs.exported_count != '0'
        run: |
          mkdir -p _site
          cp -R catalog _site/catalog
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.catalog_changed == 'true' || steps.publish.outputs.exported_count != '0'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.catalog_changed == 'true' || steps.publish.outputs.exported_count != '0'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.publish.outputs.catalog_changed == 'true' || steps.publish.outputs.exported_count != '0'
      - name: Mark published rows exported
        if: steps.publish.outputs.exported_count != '0'
        env:
          EXPORTED_IDS: ${{ steps.publish.outputs.exported_ids }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 scripts/export_approved.py --acknowledge-ids ${EXPORTED_IDS//,/ }
